[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prelude"
version = "0.1.0"
description = "Human-in-the-loop PR review from your phone"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
prelude = "prelude.cli:main"

[tool.setuptools.packages.find]
include = ["prelude*"]

[tool.setuptools.package-data]
prelude = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "SIM", "I"]
