{% if not compact %}
<div class="block-head">
  <h2>Comment</h2>
  {% if edited %}<span class="tag accent">your wording</span>{% else %}<span class="tag">Claude's wording</span>{% endif %}
</div>
{% endif %}
<div class="comment">{{ draft | text }}</div>
{% if sync_error %}<p class="error">{{ sync_error }}</p>
{% elif f.status == 'drafted' %}<p class="hint">Changes here update your GitHub draft.</p>{% endif %}
{% if edited %}
<div class="row-actions">
  <button class="btn small ghost" hx-post="/findings/{{ f.id }}/draft/reset{{ '?compact=1' if compact }}" hx-target="#draft-{{ f.id }}" hx-swap="innerHTML"
          hx-confirm="Go back to Claude's original wording?">Use Claude's original</button>
</div>
{% endif %}
