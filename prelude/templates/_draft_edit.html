<form hx-post="/findings/{{ f.id }}/draft{{ '?compact=1' if compact }}" hx-target="#draft-{{ f.id }}" hx-swap="innerHTML">
  <div class="block-head"><h2>Edit comment</h2></div>
  <textarea name="text" rows="7" class="autogrow" autofocus>{{ draft }}</textarea>
  <div class="row-actions">
    <button class="btn small primary" type="submit">Save</button>
    <button class="btn small ghost" type="button" data-key="esc" hx-get="/findings/{{ f.id }}/draft{{ '?compact=1' if compact }}" hx-target="#draft-{{ f.id }}" hx-swap="innerHTML">Cancel</button>
    {% if edited %}<button class="btn small ghost" type="button" hx-post="/findings/{{ f.id }}/draft/reset{{ '?compact=1' if compact }}" hx-target="#draft-{{ f.id }}" hx-swap="innerHTML" hx-confirm="Go back to Claude's original wording?">Use Claude's original</button>{% endif %}
  </div>
  {% if edited %}
  <details class="original"><summary>Claude's original</summary><div class="comment muted">{{ f.claude_comment | text }}</div></details>
  {% endif %}
</form>
